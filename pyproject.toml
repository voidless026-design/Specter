[project]
name = "ev-assistant"
version = "0.2.0"
description = "E.V. - an always-on, voice-activated personal assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.69.0",
    "vosk>=0.3.45",
    "sounddevice>=0.4.7",
    "numpy>=1.26",
    "edge-tts>=6.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=12.0",
    "httpx>=0.27",
    "feedparser>=6.0.11",
    "platformdirs>=4.2",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ev = "ev_assistant.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ev_assistant*"]

[tool.setuptools.package-data]
ev_assistant = ["gui/*.html"]
